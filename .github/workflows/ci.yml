name: Build and test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run format:check
      - run: npm exec tsc -- --noEmit
      - run: npm run build:prod
      - uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: duty_test
          MYSQL_USER: duty
          MYSQL_PASSWORD: duty_ci_only
          MYSQL_ROOT_PASSWORD: root_ci_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew test bootJar --no-daemon
      - name: Verify migrations and service behavior on MySQL
        run: ./gradlew test --rerun-tasks --no-daemon
        env:
          SPRING_PROFILES_ACTIVE: mysql-test
          DB_URL: jdbc:mysql://localhost:3306/duty_test
          DB_USERNAME: duty
          DB_PASSWORD: duty_ci_only
      - uses: actions/upload-artifact@v4
        with:
          name: server-jar
          path: server/build/libs/duty-manager-server-0.1.0.jar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-test-results
          path: server/build/reports/tests/test
